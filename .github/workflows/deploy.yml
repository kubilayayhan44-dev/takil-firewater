name: 🚀 Deploy to Hetzner

# main branch'e her push'ta otomatik tetiklenir
on:
  push:
    branches: [main]
  workflow_dispatch: # Actions tab'ından manuel tetikleme

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Takıl to Hetzner
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy game files to /opt/takil-app
        run: |
          # Game asset'leri + worldly server + games/ (Kelime Savaşı) + provisioning
          # script'leri yolla. --delete ile dest'teki extraneous dosyalar silinir; --exclude="*" geri kalan
          # her şeyi korur (silmez). dev-server.js + deploy/ artık transfer setinde.
          #
          # rsync kuralı: İLK MATCH KAZANIR → exclude'lar kapsayan include'lardan ÖNCE olmalı.
          # 'node_modules' exclude'u 'games/**'den önce kondu, yoksa lokal 100MB+ node_modules
          # sunucuya gider. Pattern'de slash yok → her seviyedeki node_modules bileşenini yakalar
          # (games/kelime-savasi/node_modules dahil). Excluded → --delete onları sunucuda korur
          # (provision'ın npm ci ile kurduğu bağımlılıklar silinmez).
          # games/** include'u package-lock.json'u da kapsar — provision npm ci için onu ister.
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude="node_modules" \
            --include="index.html" \
            --include="og-image.png" \
            --include="dev-server.js" \
            --include="vendor/" \
            --include="vendor/**" \
            --include="deploy/" \
            --include="deploy/**" \
            --include="games/" \
            --include="games/**" \
            --exclude="*" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/takil-app/

      - name: ⚙️ Provision worldly + kelime-savasi services & Caddy routes
        run: |
          # Idempotent: systemd unit kur/yenile + restart, Caddy /api/worldly/* +
          # /games/kelime-savasi/* route'larını ekle (backup + validate + rollback).
          # Kelime Savaşı kurulumu yumuşak-skip: dosyalar/Node hazir değilse atlanır,
          # worldly + ana site her koşulda provision edilir.
          # Script /opt/takil-app/deploy/ altından çalışır.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'bash /opt/takil-app/deploy/provision.sh'

      - name: 🌐 Health check
        run: |
          BASE="https://178-105-90-130.nip.io"
          sleep 3

          # 1) Ana site (index.html) — mevcut kritik check KORUNDU
          OK_MAIN=0
          for i in 1 2 3; do
            S=$(curl -sL -k -o /dev/null -w "%{http_code}" "$BASE/" || echo "000")
            if [ "$S" = "200" ]; then echo "✅ Ana site canlıda (HTTP $S)"; OK_MAIN=1; break; fi
            echo "  ana site deneme $i: HTTP $S — 3sn..."; sleep 3
          done
          [ "$OK_MAIN" = "1" ] || { echo "❌ Ana site cevap vermiyor!"; exit 1; }

          # 2) Express backend regression (Caddy /api/* → 3211 hala çalışıyor mu?)
          #    Uyarı seviyesi: /api/health endpoint'i kesin değil, deploy'u false-fail etmesin.
          S=$(curl -sL -k -o /dev/null -w "%{http_code}" "$BASE/api/health" || echo "000")
          if [ "$S" = "200" ]; then
            echo "✅ Express backend /api/health (HTTP $S)"
          else
            echo "⚠️  Express /api/health: HTTP $S (endpoint yoksa normal; routing regresyonu olabilir — manuel kontrol)"
          fi

          # 3) Worldly ping (Overpass'e gitmeyen hafif liveness)
          OK_PING=0
          for i in 1 2 3; do
            S=$(curl -sL -k -o /dev/null -w "%{http_code}" "$BASE/api/worldly/ping" || echo "000")
            if [ "$S" = "200" ]; then echo "✅ Worldly ping (HTTP $S)"; OK_PING=1; break; fi
            echo "  worldly ping deneme $i: HTTP $S — 3sn..."; sleep 3
          done
          [ "$OK_PING" = "1" ] || { echo "❌ Worldly ping cevap vermiyor (systemd/Caddy route sorunu)!"; exit 1; }

          # 4) Worldly discover — gerçek OSM keşfi, ok:true beklenir (Overpass'e gider, yavaş olabilir)
          BODY=$(curl -sL -k --max-time 120 "$BASE/api/worldly/discover?city=istanbul&cat=coffee" || echo "")
          if echo "$BODY" | grep -q '"ok":true'; then
            echo "✅ Worldly discover ok:true (gerçek mekan keşfi çalışıyor)"
          else
            echo "❌ Worldly discover ok:true döndürmedi. Yanıt (ilk 200ch): $(echo "$BODY" | head -c 200)"
            exit 1
          fi

          # 5) Kelime Savaşı health (games/kelime-savasi → 127.0.0.1:8766)
          #    YUMUŞAK check — hard-fail ETMEZ: games/ bu pipeline ile İLK KEZ transfer
          #    ediliyor; provision'da dosyalar/Node hazir değilse kurulum yumuşak-skip
          #    edilir, ilk denemede 200 gelmemesi kafa karıştırmasın. Ana site + worldly
          #    check'leri (1, 3, 4) yukarıda ZORUNLU kalır.
          #    Kalıcı ⚠️ durumunda sunucuda bak: systemctl status kelime-savasi,
          #    journalctl -u kelime-savasi -n 50, systemctl reload caddy sonrası route.
          KS_OK=0
          for i in 1 2 3; do
            S=$(curl -sL -k -o /dev/null -w "%{http_code}" "$BASE/games/kelime-savasi/api/health" || echo "000")
            if [ "$S" = "200" ]; then echo "✅ Kelime Savaşı health (HTTP $S)"; KS_OK=1; break; fi
            echo "  kelime savaşı deneme $i: HTTP $S — 3sn..."; sleep 3
          done
          if [ "$KS_OK" != "1" ]; then
            echo "⚠️  Kelime Savaşı /games/kelime-savasi/api/health: 200 değil."
            echo "    Oyun dosyaları henüz repoya merge edilmemişse normal — sonraki deploy'da düzelir."
          fi

          echo "🎉 Tüm zorunlu health check'ler geçti (Kelime Savaşı yumuşak check — durumu yukarıda)"

      - name: 🧹 Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
